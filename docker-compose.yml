  version: '3.8'

  services:

    selenium-hub:
      image: selenium/hub:4.37.0

      container_name: selenium-hub

      ports:
        - "4444:4444"

      environment:
        - SE_SESSION_REQUEST_TIMEOUT=300
        - SE_SESSION_RETRY_INTERVAL=5

    chrome:
      image: selenium/node-chrome:4.37.0

      container_name: chrome-node

      shm_size: 2gb

      depends_on:
        - selenium-hub

      environment:
        - SE_EVENT_BUS_HOST=selenium-hub
        - SE_EVENT_BUS_PUBLISH_PORT=4442
        - SE_EVENT_BUS_SUBSCRIBE_PORT=4443

    firefox:
      image: selenium/node-firefox:4.37.0

      container_name: firefox-node

      shm_size: 2gb

      depends_on:
        - selenium-hub

      environment:
        - SE_EVENT_BUS_HOST=selenium-hub
        - SE_EVENT_BUS_PUBLISH_PORT=4442
        - SE_EVENT_BUS_SUBSCRIBE_PORT=4443

    appium:
      image: appium/appium

      container_name: appium-server

      privileged: true

      ports:
        - "4723:4723"

      environment:
        - RELAXED_SECURITY=true

    automation-tests:
      build:
        context: .

      container_name: automation-tests

      depends_on:
        - selenium-hub
        - appium

      volumes:
        - ./reports:/app/reports

      command: >
        mvn clean test